# electron-builder 配置 - gacode PC 版
#
# 产物:
#   - NSIS installer: Gacode-Setup-{version}.exe (双击装,可选盘位)
#   - Portable: Gacode-{version}-portable.exe (免装双击即跑)
#
# 注意:
#   - 不配 code signing(无证书),electron-builder 默认跳过 Win 签名
#   - perMachine=false 装到 %LOCALAPPDATA%\Programs\Gacode\,不污染 Program Files
#   - asar: true + compression: maximum 压缩 Electron 资源
#
# 0.7.5 (Deliveries/Detail/Browser/Register/AutoUpdate P1+P2 — misc worker):
#   - output 改 release-misc-p1-v1/ 绕开 release-* 历史目录, 避免 Windows
#     Search Indexer 锁住旧目录 EBUSY.
# 0.7.5 (ChatDetail PlusActionsSheet hotfix 2 — gaga 反馈 2026-10-20):
#   - output 改 release-chatdetail-plus-v1/ 绕 Search Indexer

appId: com.gaga.gacode
productName: Gacode
buildVersion: 0.7.5
copyright: Copyright © 2026 gaga

directories:
  buildResources: build
  # 0.7.5 (ChatDetail PlusActionsSheet hotfix 2): 隔离输出目录
  output: release-chatdetail-plus-v1

files:
  - dist/**/*
  - package.json
  - '!**/*.map'

asar: true
disableSanityCheckAsar: true
compression: maximum

# 0.7.5 global-11: electron-updater 配置 publish
# provider=github + owner/repo — electron-builder 打包时会自动生成 latest.yml
# 等 gagaOS 拍 push release 时 (git push + tag), autoUpdater.checkForUpdates 就能
# 拉到. 现阶段不 push, 所以 update 永远 = no-update.
publish:
  provider: github
  owner: gagaliu02-png
  repo: gacode-electron
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Gacode-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gacode
  uninstallDisplayName: Gacode
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: Gacode-Setup-${version}.${ext}

portable:
  artifactName: Gacode-${version}-portable.${ext}