# 0.7.14 (PC 端对标安卓体验一轮 · gaga 2026-11-02 反馈的 4 条):
#   - bug1 抽屉会话列表不刷新 ⇒ 侧栏 ["chats"] 加 refetchOnWindowFocus (聚焦即刷新) + 终态后延迟补刷
#   - bug2 发的消息不立刻上屏 ⇒ pendingUserMsg 乐观上屏 (对标安卓 sendInternal 立刻写 user 行)
#   - bug3 一直弹重试 ⇒ ACK_DONE 见到终态帧就发 (解开与服务端的互等, 同 web 批 G7)
#   - bug4 工具卡片浮在气泡外面 ⇒ 富事件挪进 assistant 气泡容器内部 (对标 web / 安卓)
#   - output 改 release-sse-parity-v14/ 绕开 v13 目录 (每次换新目录)
# 0.7.15 (工具使用过程收纳进「思考和工具」折叠区 · gaga 2026-11-04 截图反馈):
#   - 工具卡片 (tool_start 带参数 / tool_done 带耗时) 从**正文**挪进
#     「思考 N 次 · 工具 N 次」折叠区 (安卓同款: PhasesList → ToolPhaseRow →
#     RichBubbleList); assistant 气泡正文只剩 Markdown
#   - output 改 release-tool-fold-v15/ 绕开 v14 目录 (每次换新目录)
# 0.7.16 (输入框右侧删掉「重新生成」(↺) 态 · gaga 2026-11-04 截图反馈 · 批 G10):
#   - 现象: 对话早答完了, 输入框右侧却一直停在橙色 ↺ (看着像卡在"重试"态),
#     而且**发送键被它顶掉** —— 点它会重跑上一条回答, 发新消息只能按 Enter
#   - 根因: PC 输入框右侧是三态按钮 (stop / rerun / send), canRerun = 最后一条
#     是 assistant 且有正文 ⇒ 每轮答完立刻变 ↺, 而且永远变不回来
#   - 修: 删掉 rerun 态 (判据 = web / 安卓, 两端都没这个状态) ⇒ 回到 stop / send 两态
#   - 顺带: handleRetry（真·错误重试）加 reconstructLastUserSubmission 兜底 ——
#     页面重载后 ref 为空时, 「重试」按钮原来点了没反应
#   - output 改 release-norerun-v16/ 绕开 v15 目录 (每次换新目录)
# 0.7.17 (侧栏入口清理 + 「我的」页跟 web 对齐 + 新增「设置」页 · gaga 2026-11-04 截图 · 批 G12):
#   - 侧栏画叉的三个入口删掉: 通知(挪到顶卡铃铛) / 我的(挪到底部用户卡) / 我的应用(永久下线)
#   - 「我的」页整页重写成 web 同款: 只读卡 名字/UID/性别/简介 + 菜单卡 交付中心/IM 配对码
#   - 新增真「设置」页 (/settings): 隐私组 修改密码 + 注销账号, 关于组 版本号 (不做检查更新)
#   - 新增 IM 配对码页 (/profile/im-binding) — POST /im-bindings/issue
#   - 改密口径跟 web/安卓对齐: 发明文 { oldPassword, newPassword } (服务端才验旧密码)
#   - output 改 release-settings-v17/ 绕开 v16 目录 (每次换新目录)
# 0.7.18 (切会话后接不上 + 停止键不亮 · 批 G13 · GC-G13-4):
#   - 切会话接不上: localRowIdRef 是组件级 ref, 切 chatId 的 effect 复位了 6 个 useState 却没复位它
#     ⇒ ensureRow() 第一行 if (localRowIdRef.current) return 永远早退 ⇒ setStreamingAssistantId 永远不调
#     ⇒ 内容写进 state 却没行可挂 ⇒ 界面纹丝不动 + isStreaming 恒 false ⇒ 停止键永远不亮
#     (「只有第一次点 session 会加载」是因为侧栏路由没 key ⇒ ChatDetail 不重挂载 ⇒ ref 跨会话存活)
#   - 停止键不亮: 接入态下 streamingMessageId 恒为 null ⇒ 亮灭判据漏了「接入流在跑」
#   - 三个 state + 三个 ref 镜像 (stalled / turnKey / turnMeta) 切会话时一起复位
#   - output 改 release-settings-v18/ 绕开 v17 目录 (每次换新目录)

# 0.7.19 (批 G18 · 端侧重连退避改成等恢复信号 —— 解锁回前台立刻重试, 不干等 30s):
#   - 退避从「干等满退避时长」改成「带超时地等恢复信号」(网络回来 / 回前台 / 手动重试)
#     ⇒ 退避上限 30s, 用户解锁那一刻本该立刻再试, 却要白等 ⇒ 现在不等了
#     (与 web / 安卓三端同款逻辑; 两端那份 src/lib/sse/reconnect.ts 逐字节相同)
#   - output 改 release-sse-backoff-v19/ 绕开 v18 目录 (每次换新目录)

appId: com.gaga.gacode
productName: Gacode
buildVersion: 0.7.19
copyright: Copyright © 2026 gaga

directories:
  buildResources: build
  # 0.7.13: 隔离输出目录 (每次换新目录, 绕 Windows Search Indexer 锁旧目录)
  output: release-sse-backoff-v19

files:
  - dist/**/*
  - package.json
  - '!**/*.map'

# 应用图标运行时解析（electron/icon.ts）:
#   - 打包后仓内 build/ **不在 files: 里** ⇒ 主进程只能靠 process.resourcesPath 找图标
#     (dev 态走 <repo>/build/, 打包态走 <安装目录>/resources/)
#   - icon.ico    → 窗口 icon (6 帧, Windows 自己挑帧)
#   - icon-16.png → 托盘 icon (原生 16px, 避免重采样糊)
# 复制到 resources 根 ⇒ <安装目录>/resources/icon.ico | icon-16.png
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon-16.png
    to: icon-16.png

asar: true
disableSanityCheckAsar: true
compression: maximum

# 0.7.5 global-11: electron-updater 配置 publish
# provider=github + owner/repo — electron-builder 打包时会自动生成 latest.yml
# 等 gagaOS 拍 push release 时 (git push + tag), autoUpdater.checkForUpdates 就能
# 拉到. 现阶段不 push, 所以 update 永远 = no-update.
publish:
  provider: github
  owner: gagaliu02-png
  repo: gacode-electron
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Gacode-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gacode
  uninstallDisplayName: Gacode
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: Gacode-Setup-${version}.${ext}

portable:
  artifactName: Gacode-${version}-portable.${ext}