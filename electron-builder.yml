# electron-builder 配置 - gacode PC 版
#
# 产物:
#   - NSIS installer: Gacode-Setup-{version}.exe (双击装,可选盘位)
#   - Portable: Gacode-{version}-portable.exe (免装双击即跑)
#
# 注意:
#   - 不配 code signing(无证书),electron-builder 默认跳过 Win 签名
#   - perMachine=false 装到 %LOCALAPPDATA%\Programs\Gacode\,不污染 Program Files
#   - asar: true + compression: maximum 压缩 Electron 资源
#
# 0.7.5 (Deliveries/Detail/Browser/Register/AutoUpdate P1+P2 — misc worker):
#   - output 改 release-misc-p1-v1/ 绕开 release-* 历史目录, 避免 Windows
#     Search Indexer 锁住旧目录 EBUSY.
# 0.7.6 (Home 5 项对齐 web — gaga 截图反馈 2026-10-20):
#   - output 改 release-home-fix-v1/ 绕 Search Indexer
# 0.7.6 P0 (Home MediaPicker 拍照/相册/文件 接线, ddcc6cd 留 bug):
#   - output 改 release-home-media-fix-v1/ 绕 Search Indexer
# 0.7.7 (阶段 9 PC vs web 对齐: PC-1~PC-7 六个 batch, gagaOS 拍板):
#   - output 改 release-align-v7/ 绕 Search Indexer 锁旧目录
#   - buildVersion bump 0.7.7 (package.json 同步)
# 0.7.8 (Home 对齐 web + Markdown 表格列宽 clamp + .gitignore 三级解锁):
#   - output 改 release-align-v8/ 绕 Search Indexer 锁旧目录
#   - buildVersion bump 0.7.8 (package.json 同步)
# 0.7.9 (A 域 179 条全量核实收口 + Markdown 全栈自研接线 M3/M4/M5):
#   - output 改 release-align-v9/ 绕 Search Indexer 锁旧目录
#   - buildVersion bump 0.7.9 (package.json 同步)
# 0.7.10 (PC↔web 逐页 1:1 收口: M11/M12/A1b/A3/A4 + C 域待办 + 图标形状对齐 web):
#   - output 改 release-align-v10/ 绕 Search Indexer 锁旧目录
#   - buildVersion bump 0.7.10 (package.json 同步)
# 0.7.11 (交付中心分页守卫 + 内联 svg 全量收编 + A 域 5 条 PC 多出项删除 +
#          knowledge_refs 发送侧/读侧接线):
#   - output 改 release-align-v11/ 绕 Search Indexer 锁旧目录 (v10 被锁死清不掉)
#   - buildVersion bump 0.7.11 (package.json 同步)

appId: com.gaga.gacode
productName: Gacode
buildVersion: 0.7.11
copyright: Copyright © 2026 gaga

directories:
  buildResources: build
  # 0.7.11: 隔离输出目录 (v10 被 Windows Search Indexer 锁死, EnsureEmptyDir 失败)
  output: release-align-v11

files:
  - dist/**/*
  - package.json
  - '!**/*.map'

# 应用图标运行时解析（electron/icon.ts）:
#   - 打包后仓内 build/ **不在 files: 里** ⇒ 主进程只能靠 process.resourcesPath 找图标
#     (dev 态走 <repo>/build/, 打包态走 <安装目录>/resources/)
#   - icon.ico    → 窗口 icon (6 帧, Windows 自己挑帧)
#   - icon-16.png → 托盘 icon (原生 16px, 避免重采样糊)
# 复制到 resources 根 ⇒ <安装目录>/resources/icon.ico | icon-16.png
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon-16.png
    to: icon-16.png

asar: true
disableSanityCheckAsar: true
compression: maximum

# 0.7.5 global-11: electron-updater 配置 publish
# provider=github + owner/repo — electron-builder 打包时会自动生成 latest.yml
# 等 gagaOS 拍 push release 时 (git push + tag), autoUpdater.checkForUpdates 就能
# 拉到. 现阶段不 push, 所以 update 永远 = no-update.
publish:
  provider: github
  owner: gagaliu02-png
  repo: gacode-electron
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Gacode-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gacode
  uninstallDisplayName: Gacode
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: Gacode-Setup-${version}.${ext}

portable:
  artifactName: Gacode-${version}-portable.${ext}